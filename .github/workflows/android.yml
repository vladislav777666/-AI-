name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java (Temurin 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: "universal"
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: "prod"

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        id: build_gradle
        run: |
          set -o pipefail
          cd android
          ./gradlew assembleDebug --no-daemon 2>&1 | tee gradle-build.log

      - name: Report Gradle error
        if: steps.build_gradle.outcome == 'failure'
        run: |
          LOG=android/gradle-build.log

          {
            echo "### Gradle failure"
            echo '```'

            if [ -f "$LOG" ]; then
              if grep -qi "what went wrong" "$LOG"; then
                awk 'BEGIN{IGNORECASE=1} /What went wrong/{f=1} f{print} /Try:/{if(f) exit}' "$LOG"
              else
                tail -n 60 "$LOG"
              fi
            else
              echo "Gradle log was not created."
            fi

            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f "$LOG" ]; then
            REASON=$(grep -i -A 6 "what went wrong" "$LOG" | head -8 | tr '\n' ' ' | cut -c1-400)
            [ -z "$REASON" ] && REASON=$(tail -n 20 "$LOG" | tr '\n' ' ' | cut -c1-400)
            echo "::error title=Gradle build failed::$REASON"
          else
            echo "::error title=Gradle build failed::Gradle log was not created."
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
