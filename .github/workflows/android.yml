name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java (Temurin 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        # VITE_SUPABASE_* берутся из .env.production (публичные ключи).
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          set -o pipefail
          cd android
          ./gradlew assembleDebug --no-daemon 2>&1 | tee gradle-build.log

      - name: Report Gradle error
        if: failure()
        run: |
          LOG=android/gradle-build.log
          {
            echo "### Gradle failure"
            echo '```'
            if grep -qi "what went wrong" "$LOG"; then
              awk 'BEGIN{IGNORECASE=1} /What went wrong/{f=1} f{print} /Try:/{if(f) exit}' "$LOG"
            else
              tail -n 60 "$LOG"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          REASON=$(grep -i -A 6 "what went wrong" "$LOG" | head -8 | tr '\n' ' ' | cut -c1-400)
          [ -z "$REASON" ] && REASON=$(tail -n 20 "$LOG" | tr '\n' ' ' | cut -c1-400)
          echo "::error title=Gradle build failed::$REASON"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
